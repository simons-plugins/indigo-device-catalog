name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for catalog changes
        id: changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(catalog|schema)/'; then
            echo "catalog_changed=true" >> $GITHUB_OUTPUT
          else
            echo "catalog_changed=false" >> $GITHUB_OUTPUT
            echo "No catalog/schema changes — skipping validation"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.catalog_changed == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.changes.outputs.catalog_changed == 'true'
        run: pip install jsonschema

      - name: Validate catalog
        if: steps.changes.outputs.catalog_changed == 'true'
        run: python tools/validate.py
